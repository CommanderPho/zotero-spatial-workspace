<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-autosave"
      data-l10n-id="pref-autosave"
    ></html:label>
    <html:input
      type="number"
      min="100"
      max="10000"
      step="100"
      id="zotero-prefpane-__addonRef__-autosave"
      preference="autosaveDelayMs"
    ></html:input>
  </hbox>
  <checkbox
    id="zotero-prefpane-__addonRef__-shownotes"
    preference="showNotes"
    data-l10n-id="pref-shownotes"
  />
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-labeldetail"
      data-l10n-id="pref-labeldetail"
    ></html:label>
    <html:select
      id="zotero-prefpane-__addonRef__-labeldetail"
      preference="labelDetail"
    >
      <html:option value="auto" data-l10n-id="pref-labeldetail-auto" />
      <html:option value="full" data-l10n-id="pref-labeldetail-full" />
      <html:option value="minimal" data-l10n-id="pref-labeldetail-minimal" />
    </html:select>
  </hbox>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
